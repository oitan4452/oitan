<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5e5cc"><title>配色で遊ぶ — OITAN</title><link rel="stylesheet" href="colors.css?v=20261127-back"><script defer src="colors.js?v=20261127"></script></head><body><main class="color-app"><header><a href="index.html">O. OITAN / 素材ライブラリ</a><a class="back-top" href="index.html">TOPに戻る</a></header><section class="heading"><div><p>色を変えて、組み合わせて。</p><h1>配色で遊ぶ。</h1></div><button id="random">✦ ランダム配色</button></section><p class="intro">色を押して変更。好きな色をロックすると、その色を残して組み合わせを試せます。</p><div id="swatches" class="swatches"></div><div class="tools"><label>配色ルール<select id="harmony"><option value="free">自由に組み合わせる</option><option value="analogous">近い色でまとめる</option><option value="complementary">反対の色を合わせる</option><option value="mono">同じ色の濃淡</option></select></label><label>色の数<select id="count"><option>3</option><option>4</option><option selected>5</option><option>6</option></select></label><button id="copy">カラーコードをまとめてコピー</button><button id="reset">最初の配色に戻す</button></div><section class="preview"><div class="preview-top"><h2>配色プレビュー</h2><button id="shuffle">色の役割を入れ替える</button></div><div id="sample" class="sample"><div class="sample-card"><span>COLOR STUDY</span><h3>好きな色から、<br>つくってみる。</h3><p>背景・文字・アクセントに使ったときのイメージです。</p><div class="sample-button">ACCENT COLOR</div><p id="contrast" class="contrast"></p></div><div class="shapes" aria-hidden="true"><i></i><i></i><i></i></div></div></section><footer>変更した配色はこのブラウザに保存されます。公開素材の追加・編集は管理者専用です。</footer><p id="status" role="status" aria-live="polite"></p></main></body></html>
